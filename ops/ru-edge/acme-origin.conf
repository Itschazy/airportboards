# Выпуск сертификата тестового RU-входа централизован в NL: из SPB недоступен
# ACME Let’s Encrypt. RU пересылает только HTTP-01 challenge в этот webroot.
server {
    listen 80;
    server_name ru-test.airportsboard.live;
    location /.well-known/acme-challenge/ { root /var/www/airportsboard-edge-acme; }
    location / { return 404; }
}
