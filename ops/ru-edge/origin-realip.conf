# До RU-входа nginx всегда брал IP TCP-peer. За новым прокси это объединило бы
# всех пользователей РФ в один per-IP бюджет live-refresh. Доверяем только
# нашему RU 85.193.89.51, который сам перезаписывает X-Real-IP из TCP-peer.
# Прямой посетитель не может подменить IP произвольным X-Real-IP.
set_real_ip_from 85.193.89.51;
real_ip_header X-Real-IP;
real_ip_recursive off;
