# RU-вход остаётся тестовым до проверки владельцем через T2 Челябинск.
# Next.js, flightStore, cron и AIRLABS_API_KEY находятся только на NL origin.
# Фиксированный IP исключает DNS-петлю после будущего переключения GeoDNS.
upstream airportsboard_origin {
    server 217.149.26.240:443;
    keepalive 32;
}
server {
    listen 80;
    server_name ru-test.airportsboard.live;
    location /.well-known/acme-challenge/ {
        proxy_pass http://217.149.26.240;
        proxy_set_header Host ru-test.airportsboard.live;
    }
    location / { return 301 https://ru-test.airportsboard.live$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name ru-test.airportsboard.live;
    ssl_certificate /etc/letsencrypt/live/ru-test.airportsboard.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru-test.airportsboard.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EDGE:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    access_log /var/log/nginx/airportsboard-edge.access.log;
    error_log /var/log/nginx/airportsboard-edge.error.log warn;
    # Тестовый адрес не должен создавать индексируемый дубль основного сайта.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Airportsboard-Edge "ru-spb-test" always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location / {
        proxy_pass https://airportsboard_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host airportsboard.live;
        proxy_set_header X-Forwarded-Host airportsboard.live;
        proxy_set_header X-Forwarded-Proto https;
        # Входящие IP-заголовки клиента перезаписываем, а не дополняем:
        # origin доверяет X-Real-IP только от конкретного IP этого прокси.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name airportsboard.live;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_ssl_session_reuse on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        # Не добавляем второй кэш: API и RSC обязаны доходить до origin.
        # Vary/Cache-Control/query/cookie и поток App Router не переписываем.
        proxy_cache off;
        proxy_buffering off;
        proxy_redirect https://airportsboard.live/ https://ru-test.airportsboard.live/;
        proxy_redirect http://airportsboard.live/ https://ru-test.airportsboard.live/;
    }
}
