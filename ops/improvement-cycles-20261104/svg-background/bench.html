<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AirportsBoard SVG: до / после</title><style>body{margin:16px;font:14px system-ui;background:#101216;color:#eee}button{padding:12px;margin:4px}#preview{width:343px;height:420px;overflow:hidden;border:1px solid #555}#preview img{width:1150px;height:1150px;max-width:none}table{border-collapse:collapse}td,th{padding:6px;border:1px solid #555}pre{white-space:pre-wrap}</style><h1>SVG-фон: до / после</h1><p>Локальная проверка. Это браузерное время SVG, не LCP Android. Исходники предварительно загружены: сеть не входит в таймер.</p><button id="run">Измерить 6 пар</button><button id="dark">Тёмная</button><button id="light">Светлая</button><button id="before">До</button><button id="after">После</button><p id="status">Готово к замеру</p><div id="preview"></div><table><thead><tr><th>№</th><th>Вариант</th><th>До 2 RAF, мс</th></tr></thead><tbody id="rows"></tbody></table><pre id="result"></pre><script>
let theme='dark',phase='before',busy=false;
const sources={};const preview=document.querySelector('#preview');
async function source(t,p){let k=t+'-'+p;if(!sources[k])sources[k]=await(await fetch('/pattern-'+k+'.svg')).text();return sources[k];}
async function paint(t,p,label){const svg=await source(t,p);const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const img=new Image();let start=performance.now();performance.mark(label+'-start');await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;preview.replaceChildren(img);});await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));let elapsed=performance.now()-start;performance.mark(label+'-end');URL.revokeObjectURL(url);return elapsed;}
async function show(){if(!busy){document.body.style.background=theme==='dark'?'#101216':'#fff';document.body.style.color=theme==='dark'?'#eee':'#111';await paint(theme,phase,'preview');}}
for(const t of ['dark','light'])document.querySelector('#'+t).onclick=()=>{theme=t;show();};
for(const p of ['before','after'])document.querySelector('#'+p).onclick=()=>{phase=p;show();};
document.querySelector('#run').onclick=async()=>{if(busy)return;busy=true;const rows=[];document.querySelector('#rows').replaceChildren();document.querySelector('#status').textContent='Загрузка обоих SVG';await source(theme,'before');await source(theme,'after');await paint(theme,'before','warm-before');await paint(theme,'after','warm-after');for(let i=0;i<6;i++){for(const p of i%2?['after','before']:['before','after']){document.querySelector('#status').textContent=`Пара ${i+1}/6: ${p}`;const ms=await paint(theme,p,`svg-${theme}-${p}-${i}`);rows.push({pair:i+1,phase:p,ms});document.querySelector('#rows').insertAdjacentHTML('beforeend',`<tr><td>${i+1}</td><td>${p}</td><td>${ms.toFixed(1)}</td></tr>`);}}let med=p=>{let a=rows.filter(r=>r.phase===p).map(r=>r.ms).sort((a,b)=>a-b);return(a[2]+a[3])/2;};const result={theme,viewport:[innerWidth,innerHeight],dpr:devicePixelRatio,userAgent:navigator.userAgent,rows,medianBefore:med('before'),medianAfter:med('after')};document.querySelector('#result').textContent=JSON.stringify(result,null,2);document.querySelector('#status').textContent='Готово';busy=false;};show();
</script></html>
