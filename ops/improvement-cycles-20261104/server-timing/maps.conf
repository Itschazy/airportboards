# Header-filter elapsed time, not full body/send duration. nginx exposes seconds
# with three decimal places; concatenate integer+fraction to emit milliseconds.
# Reject multi-upstream retry lists rather than silently choosing one attempt.
map $request_time $ab_edge_timing {
    default "";
    "~^(?<ab_edge_s>[0-9]+)\.(?<ab_edge_ms>[0-9]{3})$" "ab-edge;dur=$ab_edge_s$ab_edge_ms";
}
map "$upstream_cache_status:$upstream_header_time" $ab_origin_timing {
    default "";
    "~^(MISS|BYPASS|EXPIRED|REVALIDATED):(?<ab_origin_s>[0-9]+)\.(?<ab_origin_ms>[0-9]{3})$" ", ab-origin;dur=$ab_origin_s$ab_origin_ms";
}
# Cache hits/stale responses have no current origin work on the critical path.
# This is evaluated for each response, not copied from the cached upstream header.
map $upstream_cache_status $ab_cache_timing {
    default unknown;
    MISS MISS;
    BYPASS BYPASS;
    EXPIRED EXPIRED;
    REVALIDATED REVALIDATED;
    HIT HIT;
    STALE STALE;
    UPDATING UPDATING;
}
