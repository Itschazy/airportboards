<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flight map — public demo image</title><link rel="stylesheet" href="/assets/site.css"><link rel="stylesheet" href="/assets/style.css"><style>html,body{width:1200px;height:630px;overflow:hidden;background:#090a0d!important}body:before,body:after{display:none!important}.og{width:1200px;height:630px;display:grid;grid-template-columns:420px 1fr;align-items:center;padding:48px;gap:24px;background:radial-gradient(ellipse at 80% 45%,#151e2c,transparent 70%)}.og-copy{align-self:stretch;display:flex;flex-direction:column;justify-content:center}.og-brand{font-size:24px;font-weight:700;margin-bottom:48px}.og h1{font-size:62px;line-height:1.05;letter-spacing:-3px;max-width:350px}.og p{font-size:18px;color:#969ca5;margin-top:20px}.og small{font-size:13px;letter-spacing:1.5px;color:#969ca5;margin-top:auto}.og-map{width:100%;height:490px}.og .airport-label{stroke:#111721}.og .route-halo{stroke:#111721}</style></head><body><main class="og"><div class="og-copy"><div class="og-brand">✈ airportsboard</div><h1>My flight map</h1><p>Routes. Memories. Your story.</p><small>DEMONSTRATION · 6 FLIGHTS</small></div><svg class="og-map" role="img" aria-label="Demonstration map of six flights"></svg></main><script type="module">
// Fixed public example only; never read localStorage or a visitor's journal.
import{createMap}from'/assets/map.js';
const [airports,land]=await Promise.all([fetch('/assets/airports.json').then(r=>r.json()),fetch('/assets/land.json').then(r=>r.json())]);
const model=createMap(airports.map(a=>({...a,city:a.code})),land),flights=[['SVX','IST'],['IST','CDG'],['CDG','IST'],['IST','SVX'],['SVX','DXB'],['DXB','BKK']].map(([from,to],id)=>({id:'demo_'+id,from,to}));
const svg=document.querySelector('svg'),box=model.fit(flights,660/490);svg.setAttribute('viewBox',`${box.x} ${box.y} ${box.w} ${box.h}`);svg.innerHTML=model.body(flights,box,660,null,false);svg.querySelectorAll('.airport-city').forEach(n=>n.remove());
</script></body></html>
