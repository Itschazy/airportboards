<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Проверка PNG — AirportsBoard</title><style>body{font:16px system-ui;margin:16px;background:#eee;color:#111}button{padding:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}img{width:100%;max-width:375px;height:auto}article{border-bottom:1px solid #ccc;padding:12px 0}#probe{position:absolute;left:-10000px;top:0}</style><h1>Проверка экспорта</h1><button id="run">Проверить все варианты</button><p id="status">Готово к запуску</p><pre id="results"></pre><main id="gallery"></main><div id="probe"></div><script type="module">
import{createMap}from '/flight-map/v2/map.js';import{createExporter}from '/flight-map/v2/share.js?qa=xlink2';
const a=await(await fetch('/flight-map/v1/airports.json')).json(),l=await(await fetch('/flight-map/v1/land-v2.json')).json(),model=createMap(a,l);
const f=(from,to,i=0)=>({id:'qa_'+i,from,to,date:i%2?'2025-10-01':'2026-05-11',number:'PRIVATE 123'});
const demo=[f('SVX','IST'),f('IST','CDG',1),f('CDG','IST',2),f('IST','SVX',3),f('SVX','DXB',4),f('DXB','BKK',5)];
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;const records=[];try{const start=performance.now(),exp=await createExporter(model),fontMs=performance.now()-start;const cases=[];
for(const kind of ['map','year','flight'])for(const format of ['story','square'])for(const light of [true,false])cases.push({name:[kind,format,light?'light':'dark'].join('-'),flights:demo,kind,format,light,year:'2025',flightId:'qa_0',demo:true});
cases.push({name:'pacific',flights:[f('NRT','SFO')],kind:'flight',flightId:'qa_0',light:false}, {name:'short-route',flights:[f('HND','NRT')],light:true}, {name:'long-names',flights:[f('DWC','FSP')],kind:'flight',flightId:'qa_0',format:'square',light:true}, {name:'5000-repeated',flights:Array.from({length:5000},(_,i)=>f(i%2?'NRT':'SVX',i%2?'SFO':'IST',i)),light:false}, {name:'200-routes',flights:a.slice(0,200).filter(x=>x.code!=='LHR').map((x,i)=>f('LHR',x.code,i)),light:true});
const heavy=['RS','BO','MX','ES','SV','ME','BZ','DO','TM'].map(cc=>a.find(x=>x.country===cc||x.cc===cc||x.countryCode===cc)).filter(Boolean); if(heavy.length===9)cases.push({name:'nine-heavy-flags',flights:heavy.slice(1).map((x,i)=>f(heavy[0].code,x.code,i)),format:'square',light:false});
for(const c of cases){document.querySelector('#status').textContent='Проверка '+c.name;await new Promise(resolve=>setTimeout(resolve,0));const t=performance.now(),card=await exp.build(c),buildMs=performance.now()-t,pngStart=performance.now(),blob=await Promise.race([exp.png(card),new Promise((_,reject)=>setTimeout(()=>reject(Error('PNG timeout')),8000))]),pngMs=performance.now()-pngStart;
const probe=document.querySelector('#probe');probe.innerHTML=card.svg;document.querySelector('#status').textContent='PNG готов: '+c.name+'; проверяем шрифт';await Promise.race([document.fonts.ready,new Promise((_,reject)=>setTimeout(()=>reject(Error('probe fonts timeout')),8000))]);const texts=[...probe.querySelector('svg').children].filter(e=>e.tagName==='text');const overflow=texts.filter(e=>{const b=e.getBBox();return b.x<0||b.y<0||b.x+b.width>card.width||b.y+b.height>card.height;}).map(e=>e.textContent);
const article=document.createElement('article'),h=document.createElement('h2');h.textContent=c.name;const img=new Image();img.src=URL.createObjectURL(blob);img.alt=c.name;img.width=card.width;img.height=card.height;const link=document.createElement('a');link.href=img.src;link.download=c.name+'.png';link.textContent='Скачать '+c.name;article.append(h,img,link);document.querySelector('#gallery').append(article);
records.push({name:c.name,buildMs:+buildMs.toFixed(1),pngMs:+pngMs.toFixed(1),bytes:blob.size,width:card.width,height:card.height,overflow,privateLeak:card.svg.includes('PRIVATE')});document.querySelector('#results').textContent=JSON.stringify({fontMs,records},null,2);
}
document.querySelector('#status').textContent=records.every(r=>!r.overflow.length&&!r.privateLeak)?'PASS: '+records.length+' вариантов, переполнений и утечек нет':'FAIL';}catch(e){document.querySelector('#status').textContent='FAIL: '+String(e)+' '+(e.stack||'');}finally{document.querySelector('#run').disabled=false;}};
</script></html>
