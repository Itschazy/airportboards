<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 56" preserveAspectRatio="none">
  <!-- КАРТА СМЕЩЕНИЯ для стеклянной линзы поля поиска. Руками не смотреть глазами:
       это не картинка, а числа. feDisplacementMap читает канал R как сдвиг по оси X,
       канал G — по оси Y, и трактует их так: 0 → сдвиг на -scale, 128 → ноль,
       255 → +scale. Поэтому «нейтральный» цвет здесь #808080, а не чёрный.

       Градиент идёт через всю ширину и всю высоту, но ПОКАЗАН только у кромки:
       маска открывает его полосой вдоль края и закрывает середину, где остаётся
       нейтральный серый. Так преломляется именно край — ровно это и отличает
       стекло от матового листа. Размытие маски даёт плавный переход, иначе на
       границе полосы видна ступенька.

       preserveAspectRatio="none": карта растягивается под размер поля, каким бы
       оно ни было. Торцы капсулы при этом становятся эллиптическими, а не
       круглыми, — на кромке в 18px разница не видна. -->
  <defs>
    <linearGradient id="x" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ff0000"/>
    </linearGradient>
    <linearGradient id="y" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#00ff00"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <mask id="edge">
      <rect width="400" height="56" rx="28" fill="#ffffff"/>
      <rect x="17" y="17" width="366" height="22" rx="11" fill="#000000" filter="url(#soft)"/>
    </mask>
  </defs>

  <rect width="400" height="56" fill="#808080"/>
  <g mask="url(#edge)">
    <rect width="400" height="56" fill="url(#x)"/>
    <!-- screen: красный и зелёный складываются в независимые каналы, синий остаётся
         нулём и игнорируется фильтром. -->
    <rect width="400" height="56" fill="url(#y)" style="mix-blend-mode:screen"/>
  </g>
</svg>
